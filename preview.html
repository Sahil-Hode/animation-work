<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse intro</title>
<style>
  html, body { margin: 0; height: 100%; background: #010113; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  /* demo of the onComplete hook: page content fades in as the intro lifts off */
  #content { position: fixed; inset: 0; display: grid; place-items: center; color: #dfe6ff;
             opacity: 0; transition: opacity 0.9s ease; pointer-events: none; text-align: center; }
  #content.show { opacity: 1; }
  #content h1 { margin: 0 0 .4rem; font-size: clamp(1.6rem, 5vw, 3rem); font-weight: 600; letter-spacing: .02em; }
  #content p { margin: 0; opacity: .7; }
  button { position: Ifixed; right: 16px; bottom: 16px; z-index: 5; padding: 8px 14px; border-radius: 8px;
           border: 1px solid #3b4bff; background: rgba(20,24,80,.7); color: #cfd6ff; cursor: pointer; }
  button:hover { background: rgba(40,50,140,.85); }
</style>
</head>
<body>
  <div id="content"><div><h1>Your headline here</h1><p>Page content appears once the intro has finished.</p></div></div>

<script>
  var canvas = document.getElementById('c');
  var content = document.getElementById('content');
  var intro;
  function start() {
    content.classList.remove('show');
    if (intro) intro.destroy();
    intro = EclipseIntro.createEclipseIntro(canvas, {
      exit: true,                                   // lift-off + flash + fade-out at the end
      loop: new URLSearchParams(location.search).has('loop'),
      onComplete: function () { content.classList.add('show'); }
    });
    intro.play();
  }
  document.getElementById('replay').onclick = start;
  start();
</script>
